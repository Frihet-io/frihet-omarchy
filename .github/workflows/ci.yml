name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Leak Audit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Shell & PKGBUILD syntax check
        run: |
          bash -n aur/frihet-webapp/frihet-erp-webapp \
                  aur/frihet-webapp/install-omarchy-webapp.sh \
                  aur/frihet-webapp/PKGBUILD \
                  aur/frihet-mcp/PKGBUILD

      - name: Public surface & secret leak audit
        run: node scripts/no-public-leak.mjs

      - name: Unit, static QML & mock HTTP integration tests
        run: node --test tests/omarchy-suite.test.mjs
